server:
  port:
    8300
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8100
          predicates:
            - Path=/auth/*
          filters:
            - AuthenticationFilter
        - id: product-service
          uri: http://localhost:8200
          predicates:
            - Path=/product/*
          filters:
            - AuthenticationFilter
        - id: product-service-admin
          uri: http://localhost:8200
          predicates:
            - Path=/admin/product/*
          filters:
            - AuthenticationFilter
            - name: RoleFilter
              args:
                allowedRoles: ROLE_admin